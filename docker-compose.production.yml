services:
  backend:
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-civicfix}:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD}@postgres:5432/civicfix
      DATABASE_MODE: postgresql
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random value}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    environment:
      POSTGRES_DB: civicfix
      POSTGRES_USER: ${POSTGRES_USER:-civicfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD}
