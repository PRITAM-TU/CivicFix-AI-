# Alembic configuration file for CivicFix AI
# https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts
script_location = migrations

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Maximum length of slug in migration file name
truncate_slug_length = 40

# sys.path augmentation
prepend_sys_path = .

# Version table name
version_table = alembic_version

# ─── Database URL ───────────────────────────────────────────
# NOTE: This is overridden by env.py which reads from app settings
sqlalchemy.url = sqlite+aiosqlite:///./civicfix.db


[post_write_hooks]
# Hooks run after generating a migration file (optional)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
